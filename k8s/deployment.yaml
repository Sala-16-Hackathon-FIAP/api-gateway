apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: API_GATEWAY_IMAGE
          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: jwt-secret
            - name: AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: auth-service-url
            - name: UPLOAD_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: upload-service-url
            - name: STATUS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: status-service-url
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: notification-service-url
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: new-relic-license-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
