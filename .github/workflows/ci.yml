name: CI/CD - api-gateway

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  SERVICE_NAME: api-gateway
  SERVICE_PORT: "8081"
  EKS_CLUSTER: fiapx-cluster

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

      - name: SonarCloud analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Sala-16-Hackathon-FIAP_api-gateway \
            -Dsonar.organization=sala-16-hackathon-fiap \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fiapx-api-gateway
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Create/Update Kubernetes secrets
        run: |
          kubectl create secret generic ${{ env.SERVICE_NAME }}-secrets \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --from-literal=auth-service-url="http://auth-service.default.svc.cluster.local:8080" \
            --from-literal=upload-service-url="http://upload-service.default.svc.cluster.local:8082" \
            --from-literal=status-service-url="http://status-service.default.svc.cluster.local:8084" \
            --from-literal=notification-service-url="http://notification-service.default.svc.cluster.local:8085" \
            --from-literal=new-relic-license-key="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fiapx-api-gateway:latest"
          sed -i "s|API_GATEWAY_IMAGE|$IMAGE|g" k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/${{ env.SERVICE_NAME }}
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} --timeout=300s

      - name: Print Swagger URL
        run: |
          echo "============================================"
          echo "  API Gateway - URLs de Acesso"
          echo "============================================"
          NLB=$(kubectl get svc ${{ env.SERVICE_NAME }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "<pendente>")
          echo ""
          echo "Swagger UI:  http://${NLB}/swagger-ui.html"
          echo "Health:      http://${NLB}/actuator/health"
          echo "Base URL:    http://${NLB}/api/v1/"
          echo "============================================"
